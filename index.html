<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>🐻🎰 Jogo do Ursinho Realista</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .reel {
      transition: transform 0.2s ease-in-out;
      font-size: 3rem;
    }
    .highlight {
      animation: pulse 0.6s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-yellow-500 via-orange-500 to-red-600">  <div class="bg-white rounded-2xl shadow-2xl p-6 w-96 text-center">
    <h1 class="text-3xl font-bold mb-4">🐻🎰 Jogo do Ursinho Realista</h1><div class="flex justify-center gap-4 mb-4" id="reels">
  <div class="bg-yellow-100 rounded-xl w-20 h-24 flex items-center justify-center reel">🐻</div>
  <div class="bg-yellow-100 rounded-xl w-20 h-24 flex items-center justify-center reel">👓</div>
  <div class="bg-yellow-100 rounded-xl w-20 h-24 flex items-center justify-center reel">🐻</div>
</div>

<p class="mb-4 font-semibold" id="mensagem">Toque para girar</p>

<button onclick="girar()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-xl w-full">
  Girar
</button>

<p class="text-xs text-gray-500 mt-4">Simulador educativo • sem dinheiro real</p>

  </div><script>
  const simbolos = ["🐻", "👓", "🍀", "⭐", "💎", "🍒", "🍌", "🍉", "💰"];
  const reels = document.querySelectorAll('.reel');
  const mensagem = document.getElementById("mensagem");

  function girar() {
    mensagem.textContent = "Girando... 🎰";

    const finalSymbols = [
      simbolos[Math.floor(Math.random() * simbolos.length)],
      simbolos[Math.floor(Math.random() * simbolos.length)],
      simbolos[Math.floor(Math.random() * simbolos.length)]
    ];

    reels.forEach((reel, index) => {
      let i = 0;
      const interval = setInterval(() => {
        reel.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
        i++;
        if(i > 15 + index*5) { // rolos param em tempos diferentes
          clearInterval(interval);
          reel.textContent = finalSymbols[index];
          reel.classList.add('highlight');
          setTimeout(() => reel.classList.remove('highlight'), 1000);
        }
      }, 80);
    });

    setTimeout(() => {
      if (finalSymbols[0] === "🐻" && finalSymbols[1] === "👓" && finalSymbols[2] === "🐻") {
        mensagem.textContent = "💖 URSO + JULIETA! GRANDE PRÊMIO!";
      } else if (finalSymbols[0] === finalSymbols[1] && finalSymbols[1] === finalSymbols[2]) {
        mensagem.textContent = "🎉 Combinação perfeita!";
      } else {
        mensagem.textContent = "😅 Nada feito, tente novamente";
      }
    }, 2000);
  }
</script></body>
</html>
