<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>🎰 Cassino do Sheik</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(to bottom right, #FFD700, #FF8C00, #FF4500); }
    .reel {
      transition: transform 0.2s ease-in-out;
      font-size: 2.5rem;
    }
    .highlight {
      animation: pulse 0.6s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    .casino-title {
      font-size: 3rem;
      font-weight: bold;
      text-shadow: 2px 2px #000;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">  <h1 class="casino-title text-white">🎰 Cassino do Sheik 🎰</h1>  <div class="bg-white rounded-3xl shadow-2xl p-6 w-96 text-center">
    <div class="grid grid-cols-4 gap-3 mb-4" id="reels">
      <div class="bg-yellow-100 rounded-xl w-16 h-16 flex items-center justify-center reel">🐻</div>
      <div class="bg-yellow-100 rounded-xl w-16 h-16 flex items-center justify-center reel">👓</div>
      <div class="bg-yellow-100 rounded-xl w-16 h-16 flex items-center justify-center reel">🍀</div>
      <div class="bg-yellow-100 rounded-xl w-16 h-16 flex items-center justify-center reel">⭐</div>
      <div class="bg-yellow-100 rounded-xl w-16 h-16 flex items-center justify-center reel">💎</div>
      <div class="bg-yellow-100 rounded-xl w-16 h-16 flex items-center justify-center reel">🍒</div>
      <div class="bg-yellow-100 rounded-xl w-16 h-16 flex items-center justify-center reel">🍌</div>
      <div class="bg-yellow-100 rounded-xl w-16 h-16 flex items-center justify-center reel">💰</div>
    </div><p class="mb-4 font-semibold" id="mensagem">Toque para girar</p>

<button onclick="girar()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-xl w-full">
  Girar
</button>

<p class="text-xs text-gray-500 mt-4">Simulador educativo • sem dinheiro real</p>

  </div><audio id="somGiro" src="https://www.soundjay.com/misc/sounds/casino-slot-1.mp3"></audio>

<script>
  const simbolos = ["🐻", "👓", "🍀", "⭐", "💎", "🍒", "🍌", "🍉", "💰"];
  const reels = document.querySelectorAll('.reel');
  const mensagem = document.getElementById("mensagem");
  const somGiro = document.getElementById("somGiro");

  function girar() {
    somGiro.currentTime = 0;
    somGiro.play();

    mensagem.textContent = "Girando... 🎰";

    const finalSymbols = Array.from({length: 8}, () => simbolos[Math.floor(Math.random() * simbolos.length)]);

    reels.forEach((reel, index) => {
      let i = 0;
      const interval = setInterval(() => {
        reel.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
        i++;
        if(i > 20 + index*5) { // rolos param em tempos diferentes
          clearInterval(interval);
          reel.textContent = finalSymbols[index];
          reel.classList.add('highlight');
          setTimeout(() => reel.classList.remove('highlight'), 1200);
        }
      }, 70);
    });

    setTimeout(() => {
      // verifica se todos os símbolos são iguais
      const todosIguais = finalSymbols.every(s => s === finalSymbols[0]);
      if(todosIguais) {
        mensagem.textContent = `💖 TODOS IGUAIS! GRANDE PRÊMIO!`;
      } else {
        mensagem.textContent = `😅 Nada feito, tente novamente`;
      }
    }, 2500);
  }
</script></body>
</html>
